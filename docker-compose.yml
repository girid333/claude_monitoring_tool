# D-022. `docker compose up --build` from this directory runs the whole
# app. Podman: `podman compose up --build` (or `podman-compose`) works
# against this same file unchanged — nothing here is Docker-specific.
#
# Credentials (D-018) are intentionally NOT set here. Put them in a
# .env file next to this compose file (gitignored) or export them in your
# shell before running compose; either way they reach the backend via the
# `env_file`/environment passthrough below. Never bake them into the image.

services:
  backend:
    build:
      context: ./backend
    image: claude-monitoring-backend:local
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    environment:
      # D-024: "*" — this is a single-user, cookie-free API (no
      # allow_credentials in main.py's CORSMiddleware, so a wildcard origin
      # is safe here) reached from whatever host/IP/hostname the browser
      # happens to use; a fixed "http://localhost:3000" broke the moment
      # the app was reached via a LAN IP instead. Lock this down to
      # specific origins in .env (CORS_ORIGINS=https://your-host) if this
      # ever needs to be internet-facing or multi-tenant.
      - CORS_ORIGINS=*
      # D-050: Health Check Dashboard imports live on the same persistent
      # volume as runs.db/flows/reports (backend_data -> /data).
      - HEALTH_STORAGE_DIR=/data/health
      # SAP_<SID>_USER / SAP_<SID>_PASSWORD / REGISTRY_ENCRYPTION_KEY
      # (D-018/D-023): define these in a .env file (docker compose loads it
      # automatically) rather than listing them individually here.
    env_file:
      - path: ./.env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API: http://localhost:8000
    image: claude-monitoring-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
